<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<title>Kundenportal – Lynx Automation</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="fonts/hanken-grotesk-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="site.css">
</head>
<body class="page-portal">

<header class="topbar" id="topbar">
  <div class="wrap">
    <a href="index.html" class="brand" aria-label="Lynx Automation, zur Startseite"><img src="logo.png" alt="Lynx Automation" width="112" height="52"></a>
    <button class="burger" id="burger" aria-label="Menü" aria-expanded="false" aria-controls="menu">
      <svg class="i-open" viewBox="0 0 24 24" fill="none" stroke="#0d1b3e" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <svg class="i-close" viewBox="0 0 24 24" fill="none" stroke="#0d1b3e" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <ul class="menu" id="menu">
      <li><a href="index.html#leistungen">Leistungen</a></li>
      <li><a href="index.html#ablauf">Ablauf</a></li>
      <li><a href="referenzen.html">Referenzen</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="index.html#faq">FAQ</a></li>
      <li><a href="portal.html" class="menu-portal" aria-current="page">Kundenportal</a></li>
      <li><a href="index.html#kontakt" class="btn btn--primary">Kostenlose Kurzanalyse</a></li>
    </ul>
  </div>
</header>

<main>
  <div class="login-card">

    <!-- LOGIN-FORMULAR -->
    <div class="login-form-view" id="loginFormView">
      <span class="login-label">Kundenportal</span>
      <h1>Willkommen zurück</h1>
      <p class="login-sub">Melden Sie sich mit Ihren Zugangsdaten an.</p>

      <div class="msg" id="msgBox"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-Mail-Adresse</label>
          <input type="email" id="email" placeholder="name@betrieb.de" required autocomplete="email">
        </div>
        <div class="form-group">
          <label for="password">Passwort</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="login-btn" id="loginBtn">Anmelden</button>
      </form>

      <div class="login-links">
        <a href="#" id="forgotLink">Passwort vergessen?</a>
        <a href="index.html#kontakt">Noch kein Zugang?</a>
      </div>
    </div>

  </div>
</main>

<!-- Supabase JS SDK lokal eingebunden (keine Verbindung zu externen CDNs) -->
<script src="vendor/supabase-2.117.3.min.js"></script>
<script>
  // Supabase-Projekt: URL und öffentlicher anon-Key (aus Project Settings → API)
  const SUPABASE_URL = 'https://mjibtbfrtpxjmybvdbwc.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1qaWJ0YmZydHB4am15YnZkYndjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MDQzMjYsImV4cCI6MjEwNDE4MDMyNn0.Fqd4W4GxX3nNz1nJ7umftTboEpoQFLTKu9NEld3n2RM';

  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const loginFormView = document.getElementById('loginFormView');
  const loginForm     = document.getElementById('loginForm');
  const loginBtn      = document.getElementById('loginBtn');
  const msgBox        = document.getElementById('msgBox');
  const forgotLink    = document.getElementById('forgotLink');

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'msg ' + type;
  }

  // Beim Laden prüfen, ob schon eine aktive Sitzung besteht
  async function checkSession() {
    const { data } = await supabaseClient.auth.getSession();
    if (data.session) {
      window.location.href = 'dashboard.html';
    }
  }
  checkSession();

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    loginBtn.disabled = true;
    loginBtn.textContent = 'Wird geprüft…';
    msgBox.className = 'msg';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;
    loginBtn.textContent = 'Anmelden';

    if (error) {
      showMsg('E-Mail oder Passwort ist falsch. Bitte erneut versuchen.', 'error');
      return;
    }

    window.location.href = 'dashboard.html';
  });

  forgotLink.addEventListener('click', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email) {
      showMsg('Bitte tragen Sie zuerst oben Ihre E-Mail-Adresse ein und klicken Sie dann auf „Passwort vergessen?“.', 'error');
      return;
    }
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email);
    if (error) {
      showMsg('Das hat nicht geklappt. Bitte versuchen Sie es erneut.', 'error');
    } else {
      showMsg('Falls diese E-Mail-Adresse bei uns registriert ist, wurde ein Link zum Zurücksetzen verschickt.', 'success');
    }
  });
</script>
<script src="site.js" defer></script>
</body>
</html>
